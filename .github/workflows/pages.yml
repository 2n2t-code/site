# Publishes the site to GitHub Pages on every change to main
# (including saves from Pages CMS). Before publishing it writes the SEO text
# from the CMS into the page files (scripts/apply_seo.py).
#
# One-time setting: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Write SEO text from the CMS into the pages
        run: python3 scripts/apply_seo.py
      - name: Leave full-size originals out of the published site (it only uses the Web copies)
        run: rm -rf assets/img/photos/Original assets/video/Original
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
