# Publishes the site on every change to main (including saves from Pages CMS):
# writes the SEO text from the CMS into the pages (scripts/apply_seo.py), then
# uploads the site to the web server (gordons.hostns.io, public_html) over SSH.
# 2n2t.com is hosted there; its DNS is managed by Thunderhat (ns1/ns2.thunderhat.com).
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Uploads the site to your web server over SSH (SFTP).
  # - The server's identity is in .github/known_hosts (fingerprints confirmed
  #   with the server's owner); the upload refuses any other server.
  # - The login key is the SSH_PRIVATE_KEY secret, and its passphrase the
  #   FTP_PASSWORD secret (Settings → Secrets and variables → Actions).
  # While SSH_HOST is empty, this job does nothing.
  upload:
    name: Upload to web server (SSH)
    runs-on: ubuntu-latest
    env:
      SSH_HOST: "gordons.hostns.io"  # the server's full hostname
      SSH_USER: "alexbennett"        # the account username
      SITE_DIR: "public_html"        # the folder the website goes in
    steps:
      - uses: actions/checkout@v4
        if: env.SSH_HOST != ''
      - name: Write SEO text from the CMS into the pages
        if: env.SSH_HOST != ''
        run: python3 scripts/apply_seo.py
      - name: Set up the login key and the server's identity
        if: env.SSH_HOST != ''
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KEY_PASSPHRASE: ${{ secrets.FTP_PASSWORD }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' | sed '/^[[:space:]]*$/d; s/^[[:space:]]*//; s/[[:space:]]*$//' > ~/.ssh/deploy_key
          # If the BEGIN/END lines were left off when pasting the secret, put them back.
          if ! head -1 ~/.ssh/deploy_key | grep -q -- '-----BEGIN'; then
            { echo "-----BEGIN OPENSSH PRIVATE KEY-----"; cat ~/.ssh/deploy_key; echo "-----END OPENSSH PRIVATE KEY-----"; } > ~/.ssh/k && mv ~/.ssh/k ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          # This copy of the key lives only on GitHub's temporary machine, which
          # is wiped after the run; unlock it there so the upload can use it.
          if ! ssh-keygen -y -P "" -f ~/.ssh/deploy_key >/dev/null 2>"$RUNNER_TEMP/err.txt"; then
            if ! grep -q "incorrect passphrase" "$RUNNER_TEMP/err.txt"; then
              # Safe details only (never the key itself), to help spot a paste problem.
              echo "Key check: $(wc -l < ~/.ssh/deploy_key) lines; first line: $(head -1 ~/.ssh/deploy_key | cut -c1-40); last line: $(tail -1 ~/.ssh/deploy_key | cut -c1-40)"
              echo "Line lengths: $(awk '{print length}' ~/.ssh/deploy_key | sort -n | uniq -c | tr '\n' ' ')"
              echo "Key hash: $(sha256sum ~/.ssh/deploy_key | cut -c1-16)  ($(cat "$RUNNER_TEMP/err.txt" | sed 's#/home/runner/##'))"
              echo "::error::The SSH_PRIVATE_KEY secret isn't a complete key (it may have been changed when pasted). Paste the whole key file again, from -----BEGIN to -----END."; exit 1
            fi
            if ! ssh-keygen -p -P "$KEY_PASSPHRASE" -N "" -f ~/.ssh/deploy_key >/dev/null 2>"$RUNNER_TEMP/err.txt"; then
              echo "::error::The key's passphrase is wrong: check the FTP_PASSWORD secret (it must be the key's passphrase)."; exit 1
            fi
          fi
          cp .github/known_hosts ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
          sudo apt-get -qq update && sudo apt-get -qq install -y lftp >/dev/null
      # Photos, videos etc. upload only when new or changed in size; the small
      # text files (pages, styles, scripts, content) are re-sent every time.
      # Nothing on the server is ever deleted.
      - name: Upload the site
        if: env.SSH_HOST != ''
        run: |
          # Never uploaded: the repository's history and settings, the publishing
          # scripts, notes, and the full-size originals.
          EXCLUDES="-x ^\\.git/ -x ^\\.github/ -x ^\\.gitignore$ -x ^scripts/ -x ^README\\.md$ -x ^\\.pages\\.yml$ -x ^\\.nojekyll$ -x /Original/ -x ^\\.well-known/ -x ^cgi-bin/"
          lftp -c "
            set sftp:connect-program 'ssh -a -x -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts';
            set net:max-retries 3; set net:timeout 30;
            open -u '$SSH_USER,' 'sftp://$SSH_HOST';
            mirror -R --ignore-time --parallel=4 --verbose=1 $EXCLUDES ./ '$SITE_DIR';
            mirror -R --parallel=4 --verbose=1 \
              --include-glob *.html --include-glob *.css --include-glob *.js --include-glob *.json \
              --include-glob *.xml --include-glob *.txt --include-glob *.svg --include-glob .htaccess \
              $EXCLUDES ./ '$SITE_DIR'
          "
      # Files listed in .github/remove-from-server.txt (paths inside the site
      # folder, one per line) are deleted from the server on every publish.
      - name: Remove files that no longer belong on the server
        if: env.SSH_HOST != ''
        run: |
          CMDS=""
          while IFS= read -r f || [ -n "$f" ]; do
            f="${f%%#*}"; f="$(printf '%s' "$f" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
            case "$f" in ""|/*|*..*|*"'"*) continue;; esac
            CMDS="$CMDS rm -f '$f';"
          done < .github/remove-from-server.txt
          if [ -n "$CMDS" ]; then
            lftp -c "
              set sftp:connect-program 'ssh -a -x -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts';
              open -u '$SSH_USER,' 'sftp://$SSH_HOST';
              cd '$SITE_DIR'; $CMDS
            " && echo "Removed (if present):$(echo "$CMDS" | sed "s/rm -f//g; s/;/,/g")"
          fi
      - name: Check the upload
        if: env.SSH_HOST != ''
        run: |
          lftp -c "
            set sftp:connect-program 'ssh -a -x -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts';
            open -u '$SSH_USER,' 'sftp://$SSH_HOST';
            cd '$SITE_DIR'; rm -f err.txt; cls -1; cat index.html
          " > check.txt
          echo "== files in $SITE_DIR:"; grep -v '<' check.txt | head -40
          echo "== homepage title on the server:"; grep -o '<title>[^<]*</title>' check.txt | head -1
          echo "== where 2n2t.com points (nameservers, then addresses):"
          dig +short NS 2n2t.com @1.1.1.1 || true
          dig +short A 2n2t.com @1.1.1.1 || true
          dig +short A www.2n2t.com @1.1.1.1 || true
          echo "== email for 2n2t.com (where mail is delivered, and the anti-spam records):"
          echo "MX:"; dig +short MX 2n2t.com @1.1.1.1 || true
          for h in $(dig +short MX 2n2t.com @1.1.1.1 | awk '{print $2}'); do echo "  $h -> $(dig +short A "$h" @1.1.1.1 | tr '\n' ' ')"; done
          echo "mail.2n2t.com -> $(dig +short A mail.2n2t.com @1.1.1.1 | tr '\n' ' ')"
          echo "SPF/TXT:"; dig +short TXT 2n2t.com @1.1.1.1 || true
          echo "DKIM:"; dig +short TXT default._domainkey.2n2t.com @1.1.1.1 | cut -c1-60 || true
          echo "Mail server ports on 91.238.160.176:"; for port in 25 465 587; do timeout 6 bash -c "echo > /dev/tcp/91.238.160.176/$port" 2>/dev/null && echo "  $port open" || echo "  $port closed/filtered"; done
          echo "== https://2n2t.com as visitors see it:"
          curl -sS -o /dev/null -w "https://2n2t.com/ -> %{http_code}, served from %{remote_ip}\n" https://2n2t.com/ || echo "https://2n2t.com/ failed (e.g. no certificate yet)"
          curl -sS -o /dev/null -w "https://www.2n2t.com/ -> %{http_code} %{redirect_url}\n" https://www.2n2t.com/ || true
          curl -sS -o /dev/null -w "https://2n2t.com/film/ -> %{http_code} %{redirect_url}\n" https://2n2t.com/film/ || true
          for p in video-production/ live-in-session/ photography/ music/ about/ contact/ main.js style.css no-such-page; do
            curl -sS -o /dev/null -w "  /$p -> %{http_code}\n" "https://2n2t.com/$p" || true
          done
          echo "== the server answering for 2n2t.com (before or after the DNS switch):"
          curl -sS -o /dev/null -w "http://2n2t.com/video-production/ -> %{http_code} %{redirect_url}\n" --resolve 2n2t.com:80:91.238.160.176 http://2n2t.com/video-production/ || true
          curl -sS -o /dev/null -w "http://2n2t.com/film/ -> %{http_code} %{redirect_url}\n" --resolve 2n2t.com:80:91.238.160.176 http://2n2t.com/film/ || true
