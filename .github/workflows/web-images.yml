# When photos are added to (or changed in) assets/img/photos/Original — e.g.
# uploaded in Pages CMS — make web-sized copies in assets/img/photos/Web
# (scripts/make_web_images.py) and save them to the repository.
name: Make web versions of photos

on:
  push:
    branches: [main]
    paths:
      - "assets/img/photos/Original/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-images
  cancel-in-progress: false

jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: pip install pillow pillow-heif
      - name: Make web versions
        run: python3 scripts/make_web_images.py
      - name: Save them to the repository
        run: |
          git add assets/img/photos/Web
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Make web versions of new photos"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
