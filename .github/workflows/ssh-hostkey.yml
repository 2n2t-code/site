# One-off check: reads the web server's SSH identity (host key fingerprints)
# so they can be confirmed with the server's owner before any upload uses
# SSH. Sends no password and no files. Runs when this file changes, or by hand.
name: Check web server SSH identity

on:
  push:
    branches: [main]
    paths: [.github/workflows/ssh-hostkey.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hostkey:
    runs-on: ubuntu-latest
    steps:
      - name: Read the server's SSH host keys
        run: |
          for port in 22 2222 722 2022; do
            echo "== port $port"
            if ssh-keyscan -p "$port" -T 10 gordons.hostns.io > keys.txt 2>/dev/null && [ -s keys.txt ]; then
              ssh-keygen -lf keys.txt
              echo "--- known_hosts lines:"
              cat keys.txt
            else
              echo "(no SSH on this port)"
            fi
          done
