# Pages CMS settings (https://app.pagescms.org).
# This file tells the CMS which content files exist and which fields to show.
# The website reads the same files from the data/ folder.

media:
  - name: images
    label: Images
    input: assets/img
    output: assets/img
    categories: [image]
  - name: videos
    label: Videos
    input: assets/video
    output: assets/video
    categories: [video]

content:
  - name: videos
    label: Video work
    description: Your videos, in the order they appear in "Selected work" on the homepage. Drag to reorder. On the Video Production page, videos whose label includes "Live In Session" are featured at the top.
    type: file
    path: data/videos.json
    format: json
    fields:
      - name: videos
        label: Videos
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{category} — {title}"
        fields:
          - name: category
            label: Label
            type: string
            description: Small text above the title, e.g. "Live In Session at Silk Mill Studios", "Live Event", "Music Video".
          - name: title
            label: Title
            type: string
            required: true
            description: The artist, client or event, e.g. "Chief Springs".
          - name: link
            label: Video link
            type: string
            required: true
            description: Paste the YouTube or Vimeo link (e.g. https://www.youtube.com/watch?v=...). Playlist bits on the end are fine.
          - name: thumb
            label: Custom thumbnail (optional)
            type: image
            description: Leave empty to use YouTube's thumbnail. Needed for Vimeo videos.
          - name: mobileThumb
            label: Phone thumbnail (optional)
            type: image
            description: A thumbnail used instead on phones (screens under 640px wide), e.g. a tighter crop. 16:9 works best.
          - name: year
            label: Year (optional)
            type: string
          - name: client
            label: Client (optional)
            type: string
          - name: role
            label: Your role (optional)
            type: string
            description: e.g. "Shot & edited". Shown on the Video Production page.

  - name: home
    label: Homepage
    description: The text and showreel at the top of the homepage.
    type: file
    path: data/home.json
    format: json
    fields:
      - name: eyebrow
        label: Small text above the headline
        type: string
      - name: headline
        label: Headline
        type: string
      - name: showreel
        label: Showreel (YouTube link)
        type: string
        description: Opens with sound when someone presses "Watch the showreel". Also plays muted in the background if no showreel video file is set below.
      - name: showreelFile
        label: Showreel background video file (optional, for HD)
        type: file
        options:
          media: videos
          categories: [video]
        description: "For a crisp HD background: upload a 20–40 second cut to Videos → Original (1080p or higher, MP4 or MOV, no audio needed, no black bars, under 100 MB) and pick it here. About 2–3 minutes after uploading, GitHub makes the web versions; until then the YouTube showreel is used. Leave empty to use YouTube."
      - name: showreelTitle
        label: Showreel title
        type: string
      - name: showreelMobileImage
        label: Showreel background on phones (optional)
        type: image
        description: Shown behind the headline on phones while the showreel loads (and instead of it for visitors with data saver on). A tall, portrait image works best. Leave empty to use YouTube's thumbnail.
      - name: photographyTile
        label: Photography tile image
        type: image
      - name: photographyTileMobile
        label: Photography tile image on phones (optional)
        type: image
        description: Optional. A version cropped for phones (screens under 640px wide), used instead of the image above on phones.
      - name: musicTile
        label: Music tile image
        type: image
      - name: musicTileMobile
        label: Music tile image on phones (optional)
        type: image
        description: Optional. A version cropped for phones (screens under 640px wide), used instead of the image above on phones.
      - name: ctaHeading
        label: "Bottom section: heading"
        type: string
      - name: ctaText
        label: "Bottom section: text"
        type: text

  - name: seo
    label: SEO
    description: Meta Title and Meta Description for each main page. The six gallery pages have their own SEO fields under Photography → Galleries. Changes appear in Google once it next visits the page, which can take days.
    type: file
    path: data/seo.json
    format: json
    fields:
      - name: home
        label: Homepage
        type: object
        fields:
          - name: title
            label: Meta Title
            type: string
            description: Shown as the page title in Google results and browser tabs. Aim for 50–60 characters.
          - name: description
            label: Meta Description
            type: text
            description: Shown under the title in Google results and in link previews (WhatsApp, Facebook, LinkedIn). Aim for 120–155 characters.
      - name: film
        label: Video Production page
        type: object
        fields:
          - name: title
            label: Meta Title
            type: string
            description: Shown as the page title in Google results and browser tabs. Aim for 50–60 characters.
          - name: description
            label: Meta Description
            type: text
            description: Shown under the title in Google results and in link previews (WhatsApp, Facebook, LinkedIn). Aim for 120–155 characters.
      - name: photography
        label: Photography page
        type: object
        fields:
          - name: title
            label: Meta Title
            type: string
            description: Shown as the page title in Google results and browser tabs. Aim for 50–60 characters.
          - name: description
            label: Meta Description
            type: text
            description: Shown under the title in Google results and in link previews (WhatsApp, Facebook, LinkedIn). Aim for 120–155 characters.
      - name: music
        label: Music page
        type: object
        fields:
          - name: title
            label: Meta Title
            type: string
            description: Shown as the page title in Google results and browser tabs. Aim for 50–60 characters.
          - name: description
            label: Meta Description
            type: text
            description: Shown under the title in Google results and in link previews (WhatsApp, Facebook, LinkedIn). Aim for 120–155 characters.
      - name: about
        label: About page
        type: object
        fields:
          - name: title
            label: Meta Title
            type: string
            description: Shown as the page title in Google results and browser tabs. Aim for 50–60 characters.
          - name: description
            label: Meta Description
            type: text
            description: Shown under the title in Google results and in link previews (WhatsApp, Facebook, LinkedIn). Aim for 120–155 characters.
      - name: contact
        label: Contact page
        type: object
        fields:
          - name: title
            label: Meta Title
            type: string
            description: Shown as the page title in Google results and browser tabs. Aim for 50–60 characters.
          - name: description
            label: Meta Description
            type: text
            description: Shown under the title in Google results and in link previews (WhatsApp, Facebook, LinkedIn). Aim for 120–155 characters.

  - name: photos
    label: Photography
    description: The Featured photos on the main Photography page and the category galleries. Upload full-size photos to the photos/Original folder in Media; about a minute later GitHub adds web versions to photos/Web (name.jpg, and name-sm.jpg for the Smaller version). Pick those here, not the originals.
    type: file
    path: data/photos.json
    format: json
    fields:
      - name: highlights
        label: Featured photos
        description: The main grid on the Photography page. Portrait and square photos go in a 3-across grid, landscape photos 2-across with their caption underneath. Each photo's shape is detected automatically; drag to reorder within each group.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{alt}"
        fields: &photo_fields
          - name: src
            label: Photo
            type: image
            required: true
            description: Pick from photos/Web (e.g. name.jpg), not photos/Original.
          - name: thumb
            label: Smaller version (optional)
            type: image
            description: The matching name-sm.jpg from photos/Web. Makes the grids load faster; leave empty to use the main photo.
          - name: mobile
            label: Phone version (optional)
            type: image
            description: Used instead of the photo on phones (screens under 640px wide), e.g. a tighter crop.
          - name: alt
            label: Description
            type: string
            description: Describe the photo for people using screen readers, and for Google.
          - name: caption
            label: Caption (optional)
            type: string
      - name: categories
        label: Galleries
        description: A gallery only appears on the Photography page once it has at least one photo.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Page heading
            type: string
            description: e.g. "Street Photography".
          - name: label
            label: Short name on the gallery card
            type: string
            description: e.g. "Street".
          - name: intro
            label: Intro
            type: text
          - name: cover
            label: Card image (optional)
            type: image
            description: Leave empty to use the gallery's first photo.
          - name: coverMobile
            label: Card image on phones (optional)
            type: image
            description: Optional. A version cropped for phones (screens under 640px wide), used instead of the image above on phones.
          - name: metaTitle
            label: "SEO: Meta Title"
            type: string
            description: The page title in Google results and browser tabs. Aim for 50–60 characters.
          - name: metaDescription
            label: "SEO: Meta Description"
            type: text
            description: The summary under the title in Google results and link previews. Aim for 120–155 characters.
          - name: slug
            label: Page address (don't change)
            type: string
            readonly: true
            description: Links this gallery to its page, e.g. "street" = /photography/street/. Ask Claude to add a brand-new gallery page.
          - name: photos
            label: Photos
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{alt}"
            fields: *photo_fields

  - name: music
    label: Music
    description: Your Bandcamp releases and your bands.
    type: file
    path: data/music.json
    format: json
    fields:
      - name: releases
        label: Bandcamp releases
        description: Albums and EPs are sorted onto their own row automatically; single tracks go under Singles.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: artist
            label: Artist
            type: string
          - name: year
            label: Year (optional)
            type: string
          - name: notes
            label: Notes (optional)
            type: text
          - name: bandcamp
            label: Bandcamp embed code
            type: text
            required: true
            description: On Bandcamp, open the release, click Share / Embed → Embed this album (or track), pick any style and paste the code it gives you here.
          - name: tracklist
            label: Show the album's track list
            type: boolean
            default: true
            description: Albums only.
      - name: bands
        label: Bands
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Band name
            type: string
            required: true
          - name: spotify
            label: Spotify link
            type: string
            description: On Spotify, open the band (or an album), click ... → Share → Copy link, and paste it here.
          - name: notes
            label: Notes (optional)
            type: text

  - name: about
    label: About page
    type: file
    path: data/about.json
    format: json
    fields:
      - name: intro
        label: Line under the "About" heading
        type: string
      - name: photo
        label: Portrait
        type: image
      - name: photoMobile
        label: Portrait on phones (optional)
        type: image
        description: Optional. A version cropped for phones (screens under 640px wide), used instead of the image above on phones.
      - name: photoAlt
        label: Portrait description
        type: string
      - name: bio
        label: Bio
        type: text
        description: Leave a blank line between paragraphs. The first paragraph is shown larger.
      - name: services
        label: What I do
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Service
            type: string
          - name: description
            label: Description
            type: string

  - name: site
    label: Contact & social links
    description: Used in the footer of every page and on the Contact page.
    type: file
    path: data/site.json
    format: json
    fields:
      - name: siteUrl
        label: Site address
        type: string
        description: The site's public address, with no slash at the end. Used for Google and link previews. Now https://2n2t-code.github.io/site — when you get your own domain, change it to e.g. https://2n2t.com and the next publish updates every page.
      - name: email
        label: Email address
        type: string
        description: Where the contact form sends messages, and shown in the footer.
      - name: location
        label: Location
        type: string
      - name: instagramMain
        label: Instagram (homepage, About, Contact)
        type: string
      - name: instagramVideo
        label: Instagram (Video Production page)
        type: string
      - name: instagramPhotography
        label: Instagram (Photography pages)
        type: string
      - name: instagramMusic
        label: Instagram (Music page)
        type: string
      - name: youtube
        label: YouTube
        type: string
      - name: bandcamp
        label: Bandcamp (shown on the Music page)
        type: string
      - name: linkedin
        label: LinkedIn
        type: string
