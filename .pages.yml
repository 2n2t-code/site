# Pages CMS settings (https://app.pagescms.org).
# This file tells the CMS which content files exist and which fields to show.
# The website reads the same files from the data/ folder.

media:
  - name: images
    label: Images
    input: assets/img
    output: assets/img
    categories: [image]
  - name: videos
    label: Videos
    input: assets/video
    output: assets/video
    categories: [video]

content:
  - name: videos
    label: Video work
    description: 'Your videos, in the order they appear in "Selected work" on the homepage. Drag to reorder. On the Video Production page, videos whose label includes "Live In Session" are featured at the top. The Credits fields fill the ruled credits block on each video (empty ones are hidden); use "Credits: Extra rows" for anything else, e.g. Director, Sound, Camera — each row is a label and a value.' 
    type: file
    path: data/videos.json
    format: json
    fields:
      - name: videos
        label: Videos
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{category} — {title}"
        fields: &video_fields
          - name: category
            label: Label
            type: string
            description: Small text above the title, e.g. "Live In Session at Silk Mill Studios", "Live Event", "Music Video".
          - name: title
            label: Title
            type: string
            required: true
            description: The artist, client or event, e.g. "Chief Springs".
          - name: link
            label: Video link
            type: string
            required: true
            description: Paste the YouTube or Vimeo link (e.g. https://www.youtube.com/watch?v=...). Playlist bits on the end are fine.
          - name: videoType
            label: "Credits: Type"
            type: string
            description: Leave empty to use the part of the Label before "at" (e.g. "Live In Session").
          - name: venue
            label: "Credits: Venue"
            type: string
            description: Leave empty to use the part of the Label after "at" (e.g. "Silk Mill Studios").
          - name: song
            label: "Song (shown under the title, exactly as typed)"
            type: string
          - name: client
            label: "Credits: Client"
            type: string
          - name: year
            label: "Credits: Year"
            type: string
          - name: role
            label: "Credits: Your role"
            type: string
            description: e.g. "Shot & edited".
          - name: credits
            label: "Credits: Extra rows"
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}: {value}"
            fields:
              - name: label
                label: Label
                type: string
              - name: value
                label: Value
                type: string
          - name: thumb
            label: Custom thumbnail (optional)
            type: image
            description: Leave empty to use YouTube's thumbnail. Needed for Vimeo videos.
          - name: mobileThumb
            label: Phone thumbnail (optional)
            type: image
            description: A thumbnail used instead on phones (screens under 640px wide), e.g. a tighter crop. 16:9 works best.

  - name: session
    label: Live In Session page
    description: "The Live In Session page (in the menu under Video Production): intro, the session videos, packages and prices, extras, how booking works, The Team and the studio. Empty parts are hidden. Meta Title and Description are under SEO. For big photos, upload to photos/Original on GitHub (github.com/2n2t-code/site/upload/main/assets/img/photos/Original), then pick name.jpg from photos/Web."
    type: file
    path: data/session.json
    format: json
    fields:
      - name: intro
        label: Introduction
        type: text
        description: The line under the big Live In Session heading.
      - name: videos
        label: Session videos
        type: object
        description: "The Recent sessions on this page, in this order. Drag to reorder. These are separate from Video work, so a video can be on either page or both."
        list:
          collapsible:
            collapsed: true
            summary: "{category} — {title}"
        fields: *video_fields
      - name: packagesIntro
        label: "Packages: intro line (optional)"
        type: text
      - name: packageTags
        label: "Packages: small notes (optional)"
        type: string
        list: true
        description: Shown as small labels above the packages, e.g. "Based on a 3-track session".
      - name: packages
        label: Packages
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}: {price}"
        fields:
          - name: name
            label: Package name
            type: string
          - name: price
            label: Price (optional)
            type: string
            description: "One big price, e.g. £350 or From £350. Leave empty if you use Prices by artist below."
          - name: rates
            label: Prices by artist (optional)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}: {price}"
            fields:
              - name: label
                label: Who
                type: string
                description: e.g. Solo artist, Duo, Full band.
              - name: price
                label: Price
                type: string
          - name: note
            label: Short note (optional)
            type: string
          - name: features
            label: What's included
            type: string
            list: true
          - name: featured
            label: Highlight this package
            type: boolean
          - name: badge
            label: Highlight label (optional)
            type: string
            description: 'A small label on a highlighted package, e.g. "Most popular". Leave empty for just the orange outline.'
      - name: extrasTitle
        label: "Extras: heading"
        type: string
      - name: extras
        label: Extras
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{item}: {price}"
        fields:
          - name: item
            label: Extra
            type: string
          - name: price
            label: Price
            type: string
      - name: priceNote
        label: Note under the prices (optional)
        type: text
        description: For example deposits, travel or what the prices include.
      - name: steps
        label: How booking works
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Step
            type: string
          - name: text
            label: Details
            type: text
      - name: bookingText
        label: More booking information (optional)
        type: text
        description: Shown under the steps, for example cancellation terms or what to bring. Leave a blank line between paragraphs.
      - name: teamTitle
        label: "The Team: heading"
        type: string
      - name: team
        label: The Team
        type: object
        description: "One entry per person, in this order. Each can have a portrait, a bio and a gallery of photos (e.g. you working in the studio)."
        list:
          collapsible:
            collapsed: true
            summary: "{name}: {role}"
        fields:
          - name: name
            label: Name
            type: string
          - name: role
            label: Role
            type: string
          - name: photo
            label: Portrait
            type: image
            description: Shown 4:5, so a portrait works best. Leave empty for a plain panel with the name.
          - name: photoShape
            label: Portrait shape
            type: select
            description: "Portrait (4:5) crops the photo to a tall frame. As uploaded shows the whole photo at its own shape, e.g. for a landscape photo."
            options:
              values:
                - value: portrait
                  label: Portrait (4:5)
                - value: original
                  label: As uploaded (no cropping)
          - name: photoFocus
            label: Portrait focus
            type: select
            description: "When the photo is cropped, which part to keep in the frame. Leave empty for the centre."
            options:
              values:
                - value: center
                  label: Centre
                - value: left
                  label: Left
                - value: right
                  label: Right
                - value: top
                  label: Top
                - value: bottom
                  label: Bottom
                - value: left top
                  label: Top left
                - value: right top
                  label: Top right
                - value: left bottom
                  label: Bottom left
                - value: right bottom
                  label: Bottom right
                - value: 30% center
                  label: A little left of centre
                - value: 70% center
                  label: A little right of centre
          - name: photoMobile
            label: Portrait on phones (optional)
            type: image
          - name: photoAlt
            label: Portrait description (for screen readers and Google)
            type: string
          - name: bio
            label: Bio
            type: text
            description: Leave a blank line between paragraphs.
          - name: gallery
            label: Photos (optional)
            type: image
            options:
              multiple: true
            description: "Shown under the bio; click one to see it full size. Drag to reorder. Pick name.jpg (not -sm) from photos/Web."
          - name: link
            label: Link (optional)
            type: string
            description: For example a website or Instagram.
          - name: linkLabel
            label: Link text (optional)
            type: string
            description: Leave empty for "More about" and the name.
      - name: studio
        label: Silk Mill Studios
        type: object
        fields:
          - name: label
            label: Small label
            type: string
            description: The small orange text above the name, e.g. "The studio".
          - name: name
            label: Studio name
            type: string
          - name: text
            label: About the studio
            type: text
            description: Leave a blank line between paragraphs.
          - name: photos
            label: Photos
            type: image
            options:
              multiple: true
            description: "Drag to reorder. Pick name.jpg (not -sm) from photos/Web."
          - name: gear
            label: The gear
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{group}"
            fields:
              - name: group
                label: Group
                type: string
                description: e.g. Cameras, Microphones, Desk & outboard, Lighting.
              - name: items
                label: Items
                type: string
                list: true
          - name: link
            label: Studio website (optional)
            type: string
          - name: linkLabel
            label: Link text (optional)
            type: string
            description: Leave empty for "Visit" and the studio name.
      - name: ctaText
        label: "Bottom section: text"
        type: text
      - name: bookSubject
        label: Booking email subject
        type: string
        description: The subject line when someone presses Book a session.

  - name: home
    label: Homepage
    description: The showreel, headline and introduction at the top of the homepage.
    type: file
    path: data/home.json
    format: json
    fields:
      - name: eyebrow
        label: Small text above the headline
        type: string
      - name: headline
        label: Headline
        type: string
      - name: intro
        label: Introduction
        type: text
        description: A short introduction to you and the site, shown under the headline below the showreel. Leave a blank line between paragraphs. While it's empty, nothing shows.
      - name: showreel
        label: Showreel (YouTube link)
        type: string
        description: Opens with sound when someone presses "Watch the showreel", and is the big video at the top of the Video Production page. Also plays muted in the homepage background if no showreel video file is set below.
      - name: showreelFile
        label: Showreel background video file (optional, for HD)
        type: file
        options:
          media: videos
          categories: [video]
        description: "For a crisp HD background. The CMS can't upload videos (its limit is about 3 MB), so upload a 20–40 second cut (1080p, H.264 MP4, no audio, no black bars, under 25 MB) on GitHub at github.com/2n2t-code/site/upload/main/assets/video/Original, then pick it here from Videos → Original. About 5 minutes later the HD version is live; until then the YouTube showreel is used. Leave empty to use YouTube."
      - name: showreelTitle
        label: Showreel title
        type: string
      - name: showreelCredits
        label: "Showreel credits (Video Production page)"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}: {value}"
        fields:
          - name: label
            label: Label
            type: string
          - name: value
            label: Value
            type: string
      - name: showreelThumb
        label: Showreel thumbnail (optional)
        type: image
        description: The still image for the showreel on the homepage tile, the Video Production page and phones. A 16:9 landscape image (1920×1080) with no black bars works best. Leave empty to use the YouTube showreel's thumbnail.
      - name: showreelMobileImage
        label: Showreel thumbnail on phones (optional)
        type: image
        description: Only if you want a different crop on phones. Leave empty to use the Showreel thumbnail above.
      - name: photographyTile
        label: Photography tile image
        type: image
      - name: photographyTileMobile
        label: Photography tile image on phones (optional)
        type: image
        description: Optional. A version cropped for phones (screens under 640px wide), used instead of the image above on phones.
      - name: musicTile
        label: Music tile image
        type: image
      - name: musicTileMobile
        label: Music tile image on phones (optional)
        type: image
        description: Optional. A version cropped for phones (screens under 640px wide), used instead of the image above on phones.
      - name: ctaHeading
        label: "Bottom section: heading"
        type: string
      - name: ctaText
        label: "Bottom section: text"
        type: text

  - name: seo
    label: SEO
    description: Meta Title and Meta Description for each main page. The six gallery pages have their own SEO fields under Photography → Galleries. Changes appear in Google once it next visits the page, which can take days.
    type: file
    path: data/seo.json
    format: json
    fields:
      - name: home
        label: Homepage
        type: object
        fields:
          - name: title
            label: Meta Title
            type: string
            description: Shown as the page title in Google results and browser tabs. Aim for 50–60 characters.
          - name: description
            label: Meta Description
            type: text
            description: Shown under the title in Google results and in link previews (WhatsApp, Facebook, LinkedIn). Aim for 120–155 characters.
      - name: film
        label: Video Production page
        type: object
        fields:
          - name: title
            label: Meta Title
            type: string
            description: Shown as the page title in Google results and browser tabs. Aim for 50–60 characters.
          - name: description
            label: Meta Description
            type: text
            description: Shown under the title in Google results and in link previews (WhatsApp, Facebook, LinkedIn). Aim for 120–155 characters.
      - name: session
        label: Live In Session page
        type: object
        fields:
          - name: title
            label: Meta Title
            type: string
            description: Shown as the page title in Google results and browser tabs. Aim for 50–60 characters.
          - name: description
            label: Meta Description
            type: text
            description: Shown under the title in Google results and in link previews (WhatsApp, Facebook, LinkedIn). Aim for 120–155 characters.
      - name: photography
        label: Photography page
        type: object
        fields:
          - name: title
            label: Meta Title
            type: string
            description: Shown as the page title in Google results and browser tabs. Aim for 50–60 characters.
          - name: description
            label: Meta Description
            type: text
            description: Shown under the title in Google results and in link previews (WhatsApp, Facebook, LinkedIn). Aim for 120–155 characters.
      - name: music
        label: Music page
        type: object
        fields:
          - name: title
            label: Meta Title
            type: string
            description: Shown as the page title in Google results and browser tabs. Aim for 50–60 characters.
          - name: description
            label: Meta Description
            type: text
            description: Shown under the title in Google results and in link previews (WhatsApp, Facebook, LinkedIn). Aim for 120–155 characters.
      - name: about
        label: About page
        type: object
        fields:
          - name: title
            label: Meta Title
            type: string
            description: Shown as the page title in Google results and browser tabs. Aim for 50–60 characters.
          - name: description
            label: Meta Description
            type: text
            description: Shown under the title in Google results and in link previews (WhatsApp, Facebook, LinkedIn). Aim for 120–155 characters.
      - name: contact
        label: Contact page
        type: object
        fields:
          - name: title
            label: Meta Title
            type: string
            description: Shown as the page title in Google results and browser tabs. Aim for 50–60 characters.
          - name: description
            label: Meta Description
            type: text
            description: Shown under the title in Google results and in link previews (WhatsApp, Facebook, LinkedIn). Aim for 120–155 characters.

  - name: photos
    label: Photography
    description: "Featured photos: drag the thumbnails to reorder, + to add, × to remove. Each one's description and caption come from its gallery, or from Featured photo details (only needed for a photo that isn't in a gallery). Galleries: a gallery only appears on the Photography page once it has a photo. Upload full-size photos to photos/Original (over 3 MB: upload on GitHub at github.com/2n2t-code/site/upload/main/assets/img/photos/Original); web versions appear in photos/Web a minute later — pick name.jpg, and name-sm.jpg as the smaller version."
    type: file
    path: data/photos.json
    format: json
    fields:
      - name: featured
        label: Featured photos
        type: image
        options:
          multiple: true
        description: "The main grid on the Photography page, in this order. Drag to reorder; pick name.jpg (not -sm) from photos/Web to add."
      - name: highlights
        label: Featured photo details (optional)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{alt}"
        fields: &photo_fields
          - name: src
            label: Photo
            type: image
            required: true
            description: Pick from photos/Web (e.g. name.jpg), not photos/Original.
          - name: thumb
            label: Smaller version (optional)
            type: image
            description: The matching name-sm.jpg from photos/Web. Makes the grids load faster; leave empty to use the main photo.
          - name: mobile
            label: Phone version (optional)
            type: image
            description: Used instead of the photo on phones (screens under 640px wide), e.g. a tighter crop.
          - name: alt
            label: Description
            type: string
            description: Describe the photo for people using screen readers, and for Google.
          - name: caption
            label: Caption (optional)
            type: string
      - name: categories
        label: Galleries
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Page heading
            type: string
            description: e.g. "Street Photography".
          - name: label
            label: Short name on the gallery card
            type: string
            description: e.g. "Street".
          - name: intro
            label: Intro
            type: text
          - name: cover
            label: Card image (optional)
            type: image
            description: Leave empty to use the gallery's first photo.
          - name: coverMobile
            label: Card image on phones (optional)
            type: image
            description: Optional. A version cropped for phones (screens under 640px wide), used instead of the image above on phones.
          - name: metaTitle
            label: "SEO: Meta Title"
            type: string
            description: The page title in Google results and browser tabs. Aim for 50–60 characters.
          - name: metaDescription
            label: "SEO: Meta Description"
            type: text
            description: The summary under the title in Google results and link previews. Aim for 120–155 characters.
          - name: slug
            label: Page address (don't change)
            type: string
            readonly: true
            description: Links this gallery to its page, e.g. "street" = /photography/street/. Ask Claude to add a brand-new gallery page.
          - name: photos
            label: Photos
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{alt}"
            fields: *photo_fields

  - name: music
    label: Music
    description: Your Bandcamp releases and your bands. Albums and EPs are sorted onto their own row automatically; single tracks go under Singles.
    type: file
    path: data/music.json
    format: json
    fields:
      - name: intro
        label: Introduction (optional)
        type: text
        description: A short line under the Music heading. While it's empty, nothing shows.
      - name: releases
        label: Bandcamp releases
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: artist
            label: Artist
            type: string
          - name: year
            label: Year (optional)
            type: string
          - name: notes
            label: Notes (optional)
            type: text
          - name: bandcamp
            label: Bandcamp embed code
            type: text
            required: true
            description: On Bandcamp, open the release, click Share / Embed → Embed this album (or track), pick any style and paste the code it gives you here.
          - name: tracklist
            label: Show the album's track list
            type: boolean
            default: true
            description: Albums only.
      - name: bands
        label: Bands
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Band name
            type: string
            required: true
          - name: spotify
            label: Spotify link
            type: string
            description: On Spotify, open the band (or an album), click ... → Share → Copy link, and paste it here.
          - name: notes
            label: Notes (optional)
            type: text

  - name: about
    label: About page
    type: file
    path: data/about.json
    format: json
    fields:
      - name: intro
        label: Line under the "About" heading
        type: string
      - name: photo
        label: Portrait
        type: image
      - name: photoMobile
        label: Portrait on phones (optional)
        type: image
        description: Optional. A version cropped for phones (screens under 640px wide), used instead of the image above on phones.
      - name: photoAlt
        label: Portrait description
        type: string
      - name: bio
        label: Bio
        type: text
        description: Leave a blank line between paragraphs. The first paragraph is shown larger.
      - name: services
        label: What I do
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Service
            type: string
          - name: description
            label: Description
            type: string

  - name: site
    label: Contact & social links
    description: Used in the footer of every page and on the Contact page. Also the site address and the page backgrounds.
    type: file
    path: data/site.json
    format: json
    fields:
      - name: siteUrl
        label: Site address
        type: string
        description: The site's public address, with no slash at the end. Used for Google and link previews. Now https://2n2t-code.github.io/site — when you get your own domain, change it to e.g. https://2n2t.com and the next publish updates every page.
      - name: email
        label: Email address
        type: string
        description: Where the contact form sends messages, and shown in the footer.
      - name: location
        label: Location
        type: string
      - name: instagramMain
        label: Instagram (homepage, About, Contact)
        type: string
      - name: instagramVideo
        label: Instagram (Video Production page)
        type: string
      - name: instagramPhotography
        label: Instagram (Photography pages)
        type: string
      - name: instagramMusic
        label: Instagram (Music page)
        type: string
      - name: youtube
        label: YouTube
        type: string
      - name: bandcamp
        label: Bandcamp (shown on the Music page)
        type: string
      - name: linkedin
        label: LinkedIn
        type: string
      - name: backgroundVideo
        label: "Page background: Video Production"
        type: image
        description: Fills the page behind the content and stays still while you scroll. Leave empty for the plain dark background.
      - name: backgroundPhotography
        label: "Page background: Photography (and its gallery pages)"
        type: image
      - name: backgroundMusic
        label: "Page background: Music"
        type: image
      - name: backgroundDarkness
        label: Page background darkness (%)
        type: number
        default: 70
        options:
          min: 0
          max: 95
          step: 5
        description: How much the background images are darkened so text stays readable. 0 = full colour, 95 = almost black. Around 60–80 works best.
